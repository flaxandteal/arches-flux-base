# Known digest1 values made by GeoServer itself, used by test_geoserver_digest.py to
# check tools/geoserver_digest.py reads them the way GeoServer does. Each was made
# with a random salt, so they cannot be regenerated byte for byte; add new ones
# rather than editing these.

vectors:
  - source: GeoServer docs, security/passwd page (example digest)
    password: geoserver
    digest: digest1:YgaweuS60t+mJNobGlf9hzUC6g7gGTtPEu0TlnUxFlv0fYtBuTsQDzZcBM4AfZHd

  - source: stock admin user in the 2.28.0, 2.28.5 and 3.0.1 images
    password: geoserver
    digest: digest1:D9miJH/hVgfxZJscMafEtbtliG0ROxhLfsznyWfG38X2pda2JOSV4POi55PQI4tw

  # Made with the Jasypt jar bundled in each image:
  #   java -cp WEB-INF/lib/jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptStringDigestCLI \
  #     input=correct-horse algorithm=SHA-256 iterations=100000 saltSizeBytes=16
  # with "digest1:" prepended.
  - source: Jasypt CLI in the 2.28.0 image
    password: correct-horse
    digest: digest1:zsGEMDmXrxhyU0I5T3+7jr183iuJS7XEecQaFEeyEr++TvhBRqZIpj7EkdKwX/3m
  - source: Jasypt CLI in the 2.28.5 image
    password: correct-horse
    digest: digest1:l6g7mSU7cqkHekyKckbQdwUvZyhu6deqemIeFnoPUbkxlOHipQR1lqaCwywSbLCe
  - source: Jasypt CLI in the 3.0.1 image
    password: correct-horse
    digest: digest1:0Uq7579wQrDX2zuSNftU1/d5kb97Hj0b7+xBN+gEiCduQxmeTlaAuAfk52MgtX2y
