# Test cases for arches-instance/scripts/fill-overlay-secrets.sh, run by
# tests/fill-overlay-secrets.sh.
#
# Each case under `cases:` may have:
#   overlay:  {path: content}  the project's overlay, in data-dir layout. Mounted the
#                              way kubelet mounts the geoserver-datadir configMap,
#                              then copied into the data dir as seed-data-dir does.
#   image:    {path: content}  files already in the data dir that did not come from
#                              the overlay (stand-ins for files shipped in the
#                              geoserver image). The script should leave them alone.
#   secrets:  {key: value}     the geoserver-overlay-secrets Secret, mounted the way
#                              kubelet mounts it. Omitted = no Secret.
#   expected:
#     exit:   required, the script's exit code
#     stderr: the exact stderr
#     files:  {path: content}  the whole data dir afterwards
#
# Contents are compared byte for byte, so how a value ends matters: `|` keeps one
# final newline, `|-` keeps none, and quoted strings show newlines as \n.

shared:
  users: &users |
    <user name="admin" password="@@secret:admin@@"/>
    <user name="jo@example.org" password="@@secret:jo.example.org@@"/>
  layer: &layer |
    <name>@@secret:layer_name@@</name>
  other: &other |
    <role>@@secret:admin@@</role>
  secrets: &secrets
    admin: "digest1:ab/c+d=\n"                  # trailing newline: must be dropped
    jo.example.org: 'digest1:x&amp;y|z\w'       # &, | and \ are special to sed
    layer_name: secret_layer

cases:
  fills-placeholders:
    overlay:
      security/usergroup/default/users.xml: *users
      workspaces/ws/store/layer/layer.xml: *layer
      workspaces/ws/plain.xml: |
        <plain/>
    image:
      security/role/default/other.xml: *other
    secrets: *secrets
    expected:
      exit: 0
      files:
        security/usergroup/default/users.xml: |
          <user name="admin" password="digest1:ab/c+d="/>
          <user name="jo@example.org" password="digest1:x&amp;y|z\w"/>
        workspaces/ws/store/layer/layer.xml: |
          <name>secret_layer</name>
        workspaces/ws/plain.xml: |
          <plain/>
        security/role/default/other.xml: *other

  empty-overlay-no-secret:
    expected:
      exit: 0

  no-placeholders-no-secret:
    overlay:
      workspaces/ws/plain.xml: |
        <plain/>
    expected:
      exit: 0
      files:
        workspaces/ws/plain.xml: |
          <plain/>

  placeholders-but-no-secret:
    overlay:
      security/usergroup/default/users.xml: *users
    expected:
      exit: 1
      stderr: |
        fill-overlay-secrets: no key in secret geoserver-overlay-secrets for:
          security/usergroup/default/users.xml:@@secret:admin@@
          security/usergroup/default/users.xml:@@secret:jo.example.org@@

  missing-key:
    overlay:
      security/usergroup/default/users.xml: *users
      workspaces/ws/store/layer/layer.xml: *layer
    secrets:
      admin: "digest1:ab/c+d=\n"
      jo.example.org: 'digest1:x&amp;y|z\w'
    expected:
      exit: 1
      stderr: |
        fill-overlay-secrets: no key in secret geoserver-overlay-secrets for:
          workspaces/ws/store/layer/layer.xml:@@secret:layer_name@@

  # jo@example.org cannot be a Secret key. The similar key jo.example.org must not
  # match it, which needs the `.` escaped in the sed pattern.
  invalid-key-name:
    overlay:
      security/usergroup/default/users.xml: |
        <user name="jo@example.org" password="@@secret:jo@example.org@@"/>
    secrets: *secrets
    expected:
      exit: 1
      stderr: |
        fill-overlay-secrets: no key in secret geoserver-overlay-secrets for:
          security/usergroup/default/users.xml:@@secret:jo@example.org@@

  value-with-line-break:
    overlay:
      security/usergroup/default/users.xml: *users
    secrets:
      <<: *secrets
      admin: "line1\nline2\n"
    expected:
      exit: 1
      stderr: |
        fill-overlay-secrets: key 'admin' contains a line break
