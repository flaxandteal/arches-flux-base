apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - charts-arches.yaml
  - release.yaml
  - psp.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - geoserver-deployment.yaml
  - geoserver-service.yaml
  - geoserver-bootstrap-job.yaml
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  # Scripts run by geoserver init containers, kept as real files so they can be
  # linted and tested (tests/). The hash suffix stays on: a script change rolls the
  # geoserver Deployment.
  - name: geoserver-scripts
    namespace: ${NAMESPACE}
    files:
      - scripts/fill-overlay-secrets.sh
