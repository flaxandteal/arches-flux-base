apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoserver
  namespace: ${NAMESPACE}
  labels:
    app: geoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geoserver
  template:
    metadata:
      labels:
        app: geoserver
    spec:
      volumes:
        - name: geoserver-data
          emptyDir: {}
        - name: geoserver-config-overlay
          configMap:
            name: geoserver-datadir
            # A project with no geoserver config yet is a valid state.
            # optional=true allows for empty overlay directory.
            optional: true
        - name: geoserver-overlay-secrets
          secret:
            secretName: geoserver-overlay-secrets
            # Only projects that put @@secret:KEY@@ placeholders in their overlay
            # need this Secret; without it fill-overlay-secrets has nothing to do.
            optional: true
        - name: geoserver-scripts
          configMap:
            name: geoserver-scripts
      initContainers:
        - name: seed-data-dir
          image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # 1. Start from the data dir shipped in the image. Having a complete
              #    data dir keeps geoserver off its "first run" initialisation path.
              cp -a /usr/local/tomcat/webapps/geoserver/data/. /opt/geoserver_data/

              # 2. Drop the demo content, so the overlay is the only source of
              #    workspaces, layers and caches.
              rm -rf /opt/geoserver_data/workspaces \
                     /opt/geoserver_data/layergroups \
                     /opt/geoserver_data/gwc-layers

              # 3. Overlay the consuming project's config. This step is deliberately
              #    generic: it copies whatever the project mounted, wherever the
              #    project said it goes, and knows no filenames of its own. The
              #    directory layout comes from `items[].path` on the configMap
              #    volume, which each project supplies by patching this Deployment.
              #
              #    Note the flags. A configMap mount is not a plain directory:
              #    kubelet writes the real files under `..data/` and leaves symlinks
              #    at the mount root. So `-L` dereferences those symlinks to copy
              #    real files, and the unquoted glob (rather than `/config-overlay/.`)
              #    skips the dot-prefixed `..data` bookkeeping directories, which
              #    would otherwise land in the geoserver data dir.
              #
              #    An empty overlay is not an error: geoserver starts happily with
              #    no workspaces, which is what a project that has not written its
              #    config yet should get. `set --` + `[ -e "$1" ]` is the portable
              #    way to ask whether the glob matched, since an unmatched glob is
              #    passed through literally by /bin/sh. Testing `ls -A` instead
              #    would misfire: it still reports kubelet's `..data` directory.
              set -- /config-overlay/*
              if [ -e "$1" ]; then
                cp -rL "$@" /opt/geoserver_data/
              else
                echo "seed-data-dir: no overlay content mounted; starting with an empty catalog" >&2
              fi
          volumeMounts:
            - name: geoserver-data
              mountPath: /opt/geoserver_data
            - name: geoserver-config-overlay
              mountPath: /config-overlay
        - name: fill-overlay-secrets
          image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION}
          # The script lives in scripts/fill-overlay-secrets.sh, shipped by the
          # geoserver-scripts configMap (see kustomization.yaml).
          command: ["/bin/sh", "/scripts/fill-overlay-secrets.sh"]
          volumeMounts:
            - name: geoserver-data
              mountPath: /opt/geoserver_data
            - name: geoserver-config-overlay
              mountPath: /config-overlay
              readOnly: true
            - name: geoserver-overlay-secrets
              mountPath: /config-secrets
              readOnly: true
            - name: geoserver-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: geoserver
          image: docker.osgeo.org/geoserver:${GEOSERVER_VERSION}
          volumeMounts:
            - name: geoserver-data
              mountPath: /opt/geoserver_data
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: PROXY_BASE_URL
              value: ${GEOSERVER_PROXY_URL}
            - name: SKIP_DEMO_DATA
              value: "true"
            - name: CORS_ENABLED
              value: "true"
            - name: CORS_ALLOWED_ORIGINS
              value: "*"
            - name: GEOSERVER_CSRF_DISABLED
              value: "true"
            - name: POSTGRES_JNDI_ENABLED
              value: "true"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: geoserver-db
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: geoserver-db
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: geoserver-db
                  key: POSTGRES_DB
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: geoserver-db
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geoserver-db
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
